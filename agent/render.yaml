# Free Render service for the Voice Agent token API.
#
# The LiveKit Agent Worker is deployed separately.
# The React frontend is deployed separately on Vercel.

services:
  - type: web
    name: voice-agent-platform-token-service
    runtime: python
    plan: free
    region: oregon
    rootDir: agent

    buildCommand: "pip install -r requirements.txt"

    startCommand: "alembic upgrade head && uvicorn app.security.token_service:app --host 0.0.0.0 --port $PORT"

    healthCheckPath: /docs

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

      - key: ENVIRONMENT
        value: development

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_ISSUER
        value: voice-agent-platform

      - key: LIVEKIT_API_KEY
        sync: false

      - key: LIVEKIT_API_SECRET
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false
